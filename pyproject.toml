[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "timingdiff"
version = "0.1.0"
description = "A git-diff-style visual comparator for STA (OpenSTA / PrimeTime) timing reports."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "your-name-here" }]
keywords = ["vlsi", "eda", "sta", "static-timing-analysis", "opensta", "primetime", "timing-closure", "chip-design"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
timingdiff = "timingdiff.cli:main"

[tool.setuptools.packages.find]
include = ["timingdiff*"]
